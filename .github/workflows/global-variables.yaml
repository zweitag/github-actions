name: global-variables
on: push

jobs:
  global-variables:
    name: global-variables
    runs-on: ubuntu-latest

    steps:
      - name: checkout-repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set-global-vars
        uses: ./global-variables
      - name: test
        run: |
          [[ "$TEST" == "TEST123" ]]
          [[ "$TEST2" == "https://test.de?URL=test.de" ]]
